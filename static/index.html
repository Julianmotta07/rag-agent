<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LangChain RAG Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      width: 32px; height: 32px;
      background: #1cc8a0;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: #0f1117;
    }

    header h1 { font-size: 17px; font-weight: 600; }
    header span { font-size: 12px; color: #64748b; margin-left: 4px; }

    #status-dot {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: #64748b;
    }

    #status-dot .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #64748b;
    }
    #status-dot.ok .dot { background: #1cc8a0; }
    #status-dot.ok { color: #1cc8a0; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .message .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }

    .message.user .label { color: #7c8cff; }
    .message.agent .label { color: #1cc8a0; }

    .message .bubble {
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.65;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: #1e2235;
      border: 1px solid #2d3148;
    }

    .message.agent .bubble {
      background: #141a20;
      border: 1px solid #1f3028;
    }

    .message.agent .bubble.loading {
      color: #64748b;
      display: flex; align-items: center; gap: 8px;
    }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid #2d3148;
      border-top-color: #1cc8a0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #input-area {
      padding: 16px 24px 20px;
      background: #1a1d27;
      border-top: 1px solid #2d3148;
    }

    #input-wrapper {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #question {
      flex: 1;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 14px;
      padding: 12px 16px;
      resize: none;
      line-height: 1.5;
      min-height: 46px;
      max-height: 160px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    #question:focus { border-color: #1cc8a0; }
    #question::placeholder { color: #3d4460; }

    #send-btn {
      height: 46px;
      padding: 0 20px;
      background: #1cc8a0;
      color: #0f1117;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #send-btn:hover { background: #16b08c; }
    #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #toolbar {
      max-width: 780px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #reindex-btn {
      font-size: 12px;
      padding: 5px 12px;
      background: transparent;
      border: 1px solid #2d3148;
      color: #64748b;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      font-family: inherit;
    }
    #reindex-btn:hover { border-color: #1cc8a0; color: #1cc8a0; }
    #reindex-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #reindex-status {
      font-size: 12px;
      color: #64748b;
    }

    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #3d4460;
      gap: 10px;
      text-align: center;
      padding: 40px;
    }
    #empty-state .icon { font-size: 40px; opacity: 0.4; }
    #empty-state p { font-size: 15px; }
    #empty-state small { font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>

<header>
  <div class="logo">LC</div>
  <h1>LangChain RAG Agent</h1>
  <span>GPT-4o-mini · ChromaDB · Context7 MCP</span>
  <div id="status-dot">
    <div class="dot"></div>
    <span id="status-text">conectando...</span>
  </div>
</header>

<div id="chat-container">
  <div id="empty-state">
    <div class="icon">💬</div>
    <p>Pregunta cualquier cosa sobre LangChain</p>
    <small>
      El agente busca primero en la documentación local (ChromaDB).<br/>
      Si no encuentra respuesta, consulta Context7 en tiempo real.
    </small>
  </div>
</div>

<div id="input-area">
  <div id="toolbar">
    <button id="reindex-btn" onclick="reindex()">Re-indexar docs</button>
    <span id="reindex-status"></span>
  </div>
  <div id="input-wrapper">
    <textarea
      id="question"
      placeholder="¿Qué es LCEL? ¿Cómo se define un tool? ..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button id="send-btn" onclick="sendQuestion()">Enviar</button>
  </div>
</div>

<script>
  const API = "";

  async function checkHealth() {
    try {
      const res = await fetch(`${API}/health`);
      const dot = document.getElementById("status-dot");
      const txt = document.getElementById("status-text");
      if (res.ok) {
        dot.classList.add("ok");
        txt.textContent = "agente listo";
      } else {
        txt.textContent = "error de conexión";
      }
    } catch {
      document.getElementById("status-text").textContent = "servidor no disponible";
    }
  }

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 160) + "px";
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  }

  function appendMessage(role, text, isLoading = false) {
    const container = document.getElementById("chat-container");
    const empty = document.getElementById("empty-state");
    if (empty) empty.remove();

    const div = document.createElement("div");
    div.className = `message ${role}`;

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = role === "user" ? "Tú" : "Agente";

    const bubble = document.createElement("div");
    bubble.className = "bubble" + (isLoading ? " loading" : "");

    if (isLoading) {
      const spinner = document.createElement("div");
      spinner.className = "spinner";
      bubble.appendChild(spinner);
      bubble.appendChild(document.createTextNode("Pensando..."));
    } else {
      bubble.textContent = text;
    }

    div.appendChild(label);
    div.appendChild(bubble);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return bubble;
  }

  async function sendQuestion() {
    const input = document.getElementById("question");
    const question = input.value.trim();
    if (!question) return;

    const sendBtn = document.getElementById("send-btn");
    sendBtn.disabled = true;
    input.value = "";
    input.style.height = "auto";

    appendMessage("user", question);
    const loadingBubble = appendMessage("agent", "", true);

    try {
      const res = await fetch(`${API}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        loadingBubble.className = "bubble";
        loadingBubble.textContent = `Error ${res.status}: ${err.detail || "respuesta inesperada del servidor"}`;
      } else {
        const data = await res.json();
        loadingBubble.className = "bubble";
        loadingBubble.textContent = data.answer;
      }
    } catch (e) {
      loadingBubble.className = "bubble";
      loadingBubble.textContent = "No se pudo conectar con el servidor. ¿Está corriendo uvicorn?";
    }

    sendBtn.disabled = false;
    input.focus();
    document.getElementById("chat-container").scrollTop = 9999;
  }

  async function reindex() {
    const btn = document.getElementById("reindex-btn");
    const status = document.getElementById("reindex-status");
    btn.disabled = true;
    status.textContent = "indexando... (puede tardar varios minutos)";

    try {
      const res = await fetch(`${API}/ingest`, { method: "POST" });
      const data = await res.json();
      if (res.ok) {
        status.textContent = `Listo — ${data.chunks_generados} chunks generados`;
      } else {
        status.textContent = "Error al re-indexar";
      }
    } catch {
      status.textContent = "No se pudo conectar con el servidor";
    }

    btn.disabled = false;
  }

  checkHealth();
</script>
</body>
</html>
